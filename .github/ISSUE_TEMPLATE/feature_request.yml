name: 功能建议
description: 新的保护规则、接入能力、可选扩展或文档改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在遇到了什么问题，为什么现有配置或可选扩展解决不了。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
  - type: checkboxes
    id: scope
    attributes:
      label: 适用范围
      options:
        - label: 这项能力不依赖特定的业务目录、框架或模型供应商，可以放进模板，或作为默认不启用的可选扩展。
          required: true
